<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baya Systems — competitive radar demo</title>
  <style>
    html, body { background: #fafafa; margin: 0; }
    body {
      padding: clamp(1rem, 0.5rem + 2.1vw, 2.5rem);
      font-family: "Manrope", "Century Gothic", system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
    }
    #radar { width: 100%; }
  </style>
</head>
<body>
  <div id="radar"></div>

  <script src="baya-radar.js"></script>
  <script>
    // Replace the placeholder values below with real scores (0-10, higher = better).
    // For metrics where a LOWER raw number is better (latency, silicon area),
    // convert to a score first, e.g. 10 = best-in-class.
    // Use null where there is no data — that point is skipped on the radar.
    var chart = BayaRadar.create('#radar', {
      title: 'Interconnect IP — competitive positioning',
      subtitle: 'Scores 0–10, higher is better. Click a corner for one metric; click it again for the overall average.',
      axes: [
        { label: 'Latency',                 description: 'Higher score = lower latency' },
        { label: 'Power Efficiency',        description: 'Higher score = better perf/W' },
        { label: 'Bandwidth',               description: 'Higher score = higher sustained bandwidth' },
        { label: 'Silicon Area',            description: 'Higher score = smaller area' },
        { label: 'Physical Design Closure', description: 'Higher score = easier timing closure' }
      ],
      series: [
        { name: 'Baya Systems', color: '#0086FF', marker: 'circle',   values: [9, 8.5, 9, 8, 9.5] },
        { name: 'Competitor A', color: '#EE5023', marker: 'square',   values: [6, 5.5, 7, 5, 4]   },
        { name: 'Competitor B', color: '#09DEAB', marker: 'triangle', values: [5, 6.5, 5.5, 6.5, 5] },
        { name: 'In-house',     color: '#0000AD', marker: 'diamond',  values: [7, 6, null, 7.5, 6.5] }
      ],
      maxValue: 10,
      editable: true          // shows the live value editor; set false for a read-only chart
    });

    // Values can also be changed from code:
    //   chart.setValue(0, 2, 9.5);          // series index, axis index, value
    //   chart.update({ series: [...] });    // replace everything at once
  </script>

  <script>
    // WordPress / iframe embedding: report our rendered height to the parent
    // window so a listener on the host page (see README) can size the
    // <iframe> to fit — no fixed height or internal scrollbars needed.
    (function () {
      if (window.parent === window) return; // not embedded in an iframe
      function postHeight() {
        window.parent.postMessage(
          { source: 'baya-radar', height: document.body.scrollHeight },
          '*'
        );
      }
      window.addEventListener('load', postHeight);
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(postHeight).observe(document.body);
      } else {
        window.addEventListener('resize', postHeight);
      }
    })();
  </script>
</body>
</html>
